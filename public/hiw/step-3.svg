<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'DM Sans','Segoe UI',system-ui,sans-serif">
  <defs>
    <clipPath id="scr3"><rect x="462" y="60" width="276" height="630" rx="34"/></clipPath>
  </defs>
  <rect width="1200" height="750" fill="#FBEDE7"/>
