name: DB migrate + seed

# Manually triggered from the GitHub UI (Actions tab → "DB migrate + seed" → Run workflow).
# Applies pending Prisma migrations and seeds the demo data against the database
# pointed to by the DATABASE_URL repo secret.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Also run the seed (creates/updates the demo patient)?'
        type: boolean
        default: true

jobs:
  migrate-and-seed:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fail early if DATABASE_URL is missing
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed demo data
        if: ${{ inputs.seed }}
        run: npm run db:seed

      - name: Verify login wiring
        run: npx tsx prisma/check-login.ts
